{% extends '_base.html' %}
{% block content %}
<div class="container mt-4">
  <h4>آیا از حذف این نظر مطمئن هستید؟</h4>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">بله، حذف شود</button>
    <a href="{{ object.product.get_absolute_url }}" class="btn btn-secondary">انصراف</a>
  </form>
</div>
{% endblock %}
